name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 打包 Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 构建桌面安装包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: 生成 SHA256 校验和与自动更新清单
        shell: pwsh
        run: |
          # 显式 UTF-8 读写：latest.json 不能带 BOM，否则更新器解析 JSON 失败
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          function Read-Utf8([string] $path) { [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::UTF8) }
          function Write-Utf8NoBom([string] $path, [string] $content) { [System.IO.File]::WriteAllText($path, $content, $utf8NoBom) }

          $version = (Read-Utf8 'src-tauri/tauri.conf.json' | ConvertFrom-Json).version

          $targets = @(
            'src-tauri/target/release/bundle/nsis/*.exe',
            'src-tauri/target/release/bundle/msi/*.msi'
          )
          $lines = foreach ($file in Get-ChildItem $targets) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          Write-Utf8NoBom 'SHA256SUMS.txt' (($lines -join "`r`n") + "`r`n")
          Get-Content SHA256SUMS.txt

          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw '找不到 NSIS 安装包' }
          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path $signaturePath)) { throw "找不到更新签名文件：$signaturePath" }

          $repository = '${{ github.repository }}'
          $changelog = Read-Utf8 'CHANGELOG.md'
          $section = [regex]::Match($changelog, "(?ms)^##\s+$([regex]::Escape($version))\b[^\r\n]*\r?\n(.*?)(?=^##\s|\z)")
          $notes = if ($section.Success) { $section.Groups[1].Value.Trim() } else { '参见 Release 说明' }

          $manifest = [ordered]@{
            version   = $version
            notes     = $notes
            pub_date  = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Read-Utf8 $signaturePath).Trim()
                url       = "https://github.com/$repository/releases/download/v$version/$($installer.Name)"
              }
            }
          }
          Write-Utf8NoBom 'latest.json' ($manifest | ConvertTo-Json -Depth 5)
          Get-Content latest.json

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: markfx-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt
            latest.json
          if-no-files-found: error

      - name: 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt
            latest.json
          generate_release_notes: true
